<!DOCTYPE html>
<html>

<head>
    <title>Version 2</title>
</head>

<body style="background:yellow;">

    <h1>Version 2</h1>

    <h2>Updated Application</h2>

    <button onclick="loadData()">
        Call Backend
    </button>

    <p id="output"></p>


    <script>

        async function loadData() {

            const response =
                await fetch("http://backend-service:8000/api")

            const data =
                await response.json()

            document.getElementById(
                "output"
            ).innerHTML =
                "NEW: " + data.message
        }

    </script>

</body>

</html>
